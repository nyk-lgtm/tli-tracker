[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
  ".claude",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not perf'"
markers = [
  "perf: slower profiling-oriented tests excluded from the default test run",
]
